workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.*$/
      when: always

stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: clone
  GIT_CHECKOUT: "true"
  GIT_CLEAN_FLAGS: -ffdx
  ECR_URL: "${ECR_REGISTRY_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  DOCKER_HOST: "unix:///var/run/docker.sock"

build_images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL
    - docker builder prune -af
    - docker build --no-cache --pull --build-arg CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA -t $ECR_URL/vyomira/educate-frontend:$CI_COMMIT_SHORT_SHA .
    - docker push $ECR_URL/vyomira/educate-frontend:$CI_COMMIT_SHORT_SHA
    #- docker build --no-cache -t $ECR_URL/vyomira/educate-backend:$CI_COMMIT_SHORT_SHA ./backend
    #- docker push $ECR_URL/vyomira/educate-backend:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache aws-cli
  script:
    - >
      aws ssm send-command
      --document-name "AWS-RunShellScript"
      --targets "Key=instanceids,Values=$EDUCATE_INSTANCE_ID"
      --region "ap-south-1"
      --parameters 'commands=[
        "cd /mnt/educate_data",
        "/bin/bash ./sync_secrets.sh '"$CI_COMMIT_SHORT_SHA"' frontend '"$swaggerurl"' '"$DASHBOARD_LOGIN_URL"' '"$showsql"' '"$swaggerdoc"' '"$swaggerui"'",
        "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 306526297265.dkr.ecr.ap-south-1.amazonaws.com",
        "docker compose pull frontend",
        "docker compose up -d --no-deps frontend",
        "docker system prune -af"
      ]'
